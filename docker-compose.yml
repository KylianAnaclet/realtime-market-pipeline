services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      retries: 10

  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  producer:
    build: ./producer
    container_name: producer
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC: ticks
      SYMBOLS: btcusdt,ethusdt,solusdt,xrpusdt,dogeusdt,adausdt,bnbusdt,linkusdt,avaxusdt,maticusdt,dotusdt,ltcusdt,trxusdt,shibusdt,nearusdt,uniusdt,atomusdt,filusdt,aptusdt,arbusdt,opusdt,injusdt,suiusdt,seiusdt,tiausdt,rndrusdt,imxusdt,grtusdt,algousdt,vetusdt,etcusdt,hbarusdt,icpusdt,aaveusdt,mkrusdt,sandusdt,manausdt,axsusdt,ftmusdt,egldusdt
    volumes:
      - ./producer:/app
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  stats:
    build: ./consumer
    container_name: stats
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC: ticks
      GROUP_ID: tick-stats
      START_AT: latest
    volumes:
      - ./consumer:/app
    depends_on:
      redpanda:
        condition: service_healthy

  jobmanager:
    build: ./flink
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 600m
    volumes:
      - ./flink/sql:/opt/sql
    depends_on:
      redpanda:
        condition: service_healthy

  taskmanager:
    build: ./flink
    container_name: taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1400m
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - jobmanager

  sqlrunner:
    build: ./flink
    volumes:
      - ./flink/sql:/opt/sql
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        CONF=/opt/flink/conf/config.yaml
        [ -f "$$CONF" ] || CONF=/opt/flink/conf/flink-conf.yaml
        printf "\nexecution.target: local\n" >> "$$CONF"
        exec /opt/flink/bin/sql-client.sh -f /opt/sql/ohlc.sql

volumes:
  redpanda-data:

